<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卢炜鑫 | Portfolio</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;background:#010412}
    
    #cyber-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
    
    .scanlines-overlay{
      position:fixed;inset:0;z-index:1;pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
      animation:scanMove 8s linear infinite;
    }
    @keyframes scanMove{0%{background-position:0 0}100%{background-position:0 8px}}
    
    /* Cursor - ALWAYS VISIBLE */
    #cursor{
      position:fixed;z-index:9999;pointer-events:none;
      width:20px;height:20px;
      border:1.5px solid rgba(0,229,255,0.7);
      border-radius:50%;
      transform:translate(-50%,-50%);
      transition:width 0.2s,height 0.2s,border-color 0.2s;
      mix-blend-mode:screen;
    }
    #cursor.hover{width:48px;height:48px;border-color:rgba(139,47,255,0.8)}
    #cursor.click{width:14px;height:14px;border-color:#fff}
    #cursor-dot{
      position:fixed;z-index:9999;pointer-events:none;
      width:4px;height:4px;
      background:rgba(0,229,255,0.9);
      border-radius:50%;
      transform:translate(-50%,-50%);
      box-shadow:0 0 8px rgba(0,229,255,0.6);
    }
    
    .home-wrapper{
      position:relative;z-index:10;
      min-height:100vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;padding:2rem;
    }
    
    .cyber-name{
      font-family:'Orbitron','Space Grotesk',sans-serif;
      font-size:clamp(3.5rem,10vw,8rem);font-weight:900;
      letter-spacing:0.15em;text-transform:uppercase;color:#fff;
      text-shadow:0 0 10px #00e5ff,0 0 40px #00e5ff,0 0 80px #8b2fff,0 0 120px #00e5ff;
      animation:cyberGlow 3s ease-in-out infinite;margin-bottom:0.5rem;position:relative;
    }
    @keyframes cyberGlow{
      0%,100%{text-shadow:0 0 10px #00e5ff,0 0 40px #00e5ff,0 0 80px #8b2fff}
      50%{text-shadow:0 0 20px #36d6e7,0 0 60px #8b2fff,0 0 120px #ff1a8c,0 0 160px #00e5ff}
    }
    .cyber-name::before,.cyber-name::after{
      content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%;opacity:0.8;
    }
    .cyber-name::before{color:#36d6e7;animation:glitchTop 2s infinite;clip-path:polygon(0 0,100% 0,100% 30%,0 50%)}
    .cyber-name::after{color:#ff1a8c;animation:glitchBottom 2s infinite;clip-path:polygon(0 70%,100% 50%,100% 100%,0 100%)}
    @keyframes glitchTop{0%,100%{transform:translate(0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-1px,1px)}80%{transform:translate(2px,-1px)}}
    @keyframes glitchBottom{0%,100%{transform:translate(0)}20%{transform:translate(3px,-2px)}40%{transform:translate(-3px,2px)}60%{transform:translate(1px,-1px)}80%{transform:translate(-2px,1px)}}
    
    .cyber-tags{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin:1.5rem 0 2.5rem}
    .cyber-tag{
      padding:0.45rem 1.5rem;border:1px solid rgba(0,229,255,0.3);border-radius:4px;
      font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:#36d6e7;
      letter-spacing:0.15em;background:rgba(0,229,255,0.03);
      text-shadow:0 0 8px rgba(0,229,255,0.5);
      animation:tagPulse 2s ease-in-out infinite;position:relative;overflow:hidden;
    }
    .cyber-tag:nth-child(2){animation-delay:0.3s;color:#8b2fff;border-color:rgba(139,47,255,0.3);text-shadow:0 0 8px rgba(139,47,255,0.5)}
    .cyber-tag:nth-child(3){animation-delay:0.6s;color:#ff1a8c;border-color:rgba(255,26,140,0.3);text-shadow:0 0 8px rgba(255,26,140,0.5)}
    .cyber-tag:nth-child(4){animation-delay:0.9s}
    @keyframes tagPulse{0%,100%{box-shadow:0 0 5px rgba(0,229,255,0.1)}50%{box-shadow:0 0 20px rgba(0,229,255,0.2),0 0 40px rgba(0,229,255,0.05)}}
    
    .cyber-buttons{display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:center}
    .cyber-btn{
      padding:0.9rem 2.5rem;font-family:'JetBrains Mono',monospace;font-size:0.85rem;
      letter-spacing:0.2em;text-transform:uppercase;border-radius:4px;
      cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden;
      clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);
      text-decoration:none;display:inline-block;
    }
    .cyber-btn-start{background:transparent;border:2px solid #00e5ff;color:#00e5ff;text-shadow:0 0 10px #00e5ff;box-shadow:0 0 20px rgba(0,229,255,0.15),inset 0 0 20px rgba(0,229,255,0.05)}
    .cyber-btn-start:hover{background:rgba(0,229,255,0.1);box-shadow:0 0 40px rgba(0,229,255,0.3),0 0 80px rgba(0,229,255,0.1);transform:translateY(-2px)}
    .cyber-btn-dl{background:transparent;border:2px solid #8b2fff;color:#8b2fff;text-shadow:0 0 10px #8b2fff;box-shadow:0 0 20px rgba(139,47,255,0.15),inset 0 0 20px rgba(139,47,255,0.05)}
    .cyber-btn-dl:hover{background:rgba(139,47,255,0.1);box-shadow:0 0 40px rgba(139,47,255,0.3);transform:translateY(-2px)}
    
    .home-hint{position:absolute;bottom:2rem;font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.3em;color:rgba(0,229,255,0.3);animation:hintPulse 2s ease-in-out infinite}
    @keyframes hintPulse{0%,100%{opacity:0.3}50%{opacity:0.7}}
    
    /* Slash transition (hidden until click) */
    .slash-half{position:fixed;top:0;height:100vh;background:#010108;z-index:1001;pointer-events:none;display:none}
    .slash-half.show{display:block}
    .slash-left{left:0;width:55vw;clip-path:polygon(0 0,100% 0,25% 100%,0 100%);transform:translateX(0)}
    .slash-left.slash-out{transform:translateX(-60vw);transition:transform 0.7s cubic-bezier(0.7,0,0.3,1)}
    .slash-right{right:0;width:55vw;clip-path:polygon(75% 0,100% 0,100% 100%,0 100%);transform:translateX(0)}
    .slash-right.slash-out{transform:translateX(60vw);transition:transform 0.7s cubic-bezier(0.7,0,0.3,1)}
    .slash-flash{position:fixed;inset:0;z-index:1002;background:#fff;opacity:0;pointer-events:none;transition:opacity 0.1s}
    .slash-flash.active{opacity:1}
    .slash-zoom{transition:transform 0.6s cubic-bezier(0.7,0,0.3,1),filter 0.6s,opacity 0.6s}
    .slash-zoom.zooming{transform:scale(1.8);filter:blur(3px);opacity:0.3}
    
    @media(max-width:768px){
      #cursor,#cursor-dot{display:none}
      .cyber-name{font-size:3rem}
    }
  </style>
</head>
<body>

<canvas id="cyber-canvas"></canvas>
<canvas id="trail-canvas" style="position:fixed;inset:0;z-index:5;pointer-events:none"></canvas>
<div class="scanlines-overlay"></div>
<div id="cursor"></div>
<div id="cursor-dot"></div>

<div class="home-wrapper slash-zoom">
  <h1 class="cyber-name" data-text="卢炜鑫">卢炜鑫</h1>
  <div class="cyber-tags">
    <span class="cyber-tag">数字媒体艺术</span>
    <span class="cyber-tag">三维设计</span>
    <span class="cyber-tag">游戏关卡</span>
    <span class="cyber-tag">AIGC</span>
  </div>
  <div class="cyber-buttons">
    <a href="about.html" class="cyber-btn cyber-btn-start" id="btn-enter">▸ ENTER</a>
    <button class="cyber-btn cyber-btn-dl" id="dl-resume">⬇ RESUME</button>
  </div>
  <div class="home-hint">SCROLL OR CLICK TO EXPLORE</div>
</div>

<div class="slash-half slash-left" id="slash-l"></div>
<div class="slash-half slash-right" id="slash-r"></div>
<div class="slash-flash" id="slash-flash"></div>

<script>
// ===== CURSOR SYSTEM =====
(function(){
  var cr=document.getElementById('cursor'),cd=document.getElementById('cursor-dot');
  var cx=0,cy=0,cdx=0,cdy=0;
  document.addEventListener('mousemove',function(e){cx=e.clientX;cy=e.clientY;if(cd){cd.style.left=cx+'px';cd.style.top=cy+'px'}});
  function ac(){cdx+=(cx-cdx)*0.12;cdy+=(cy-cdy)*0.12;if(cr){cr.style.left=cdx+'px';cr.style.top=cdy+'px'}requestAnimationFrame(ac)}
  ac();
  var ht='a,button,.cyber-btn';
  document.addEventListener('mouseover',function(e){if(e.target.closest(ht)&&cr)cr.classList.add('hover')});
  document.addEventListener('mouseout',function(e){if(e.target.closest(ht)&&cr)cr.classList.remove('hover')});
  document.addEventListener('mousedown',function(){if(cr)cr.classList.add('click')});
  document.addEventListener('mouseup',function(){if(cr)cr.classList.remove('click')});
})();

// ===== ENTER TRANSITION =====
document.getElementById('btn-enter').addEventListener('click',function(e){
  e.preventDefault();var t=this.getAttribute('href');
  var w=document.querySelector('.home-wrapper'),sl=document.getElementById('slash-l'),sr=document.getElementById('slash-r'),sf=document.getElementById('slash-flash');
  sl.classList.add('show');sr.classList.add('show');sl.offsetHeight;
  if(w)w.classList.add('slash-zoom','zooming');
  setTimeout(function(){sl.classList.add('slash-out');sr.classList.add('slash-out')},100);
  setTimeout(function(){sf.classList.add('active')},450);
  setTimeout(function(){window.location.href=t},600);
});

// ===== RESUME DOWNLOAD =====
document.getElementById('dl-resume').addEventListener('click',function(){
  var a=document.createElement('a');a.href='简历.pdf';a.download='卢炜鑫_简历.pdf';a.click();
});

// ===== WIREFRAME CITY CANVAS =====
(function(){
  var C=document.getElementById('cyber-canvas');if(!C)return;
  var X=C.getContext('2d'),W,H;
  function R(){W=C.width=window.innerWidth;H=C.height=window.innerHeight}R();window.addEventListener('resize',R);
  var M={x:W/2,y:H/2};document.addEventListener('mousemove',function(e){M.x=e.clientX;M.y=e.clientY});
  var T=0,scrollY=0;window.addEventListener('scroll',function(){scrollY=window.pageYOffset});
  var clicks=[];document.addEventListener('click',function(e){clicks.push({x:e.clientX,y:e.clientY,r:0,a:0.8})});

  var cam={x:0,y:1.8,z:0.5,tx:0,ty:0};
  var VPX=W/2,VPY=H*0.55;

  function project(x,y,z){
    var dx=x-cam.x,dy=y-cam.y,dz=z-cam.z;
    var rx=dx*Math.cos(-cam.tx)-dz*Math.sin(-cam.tx);
    var rz=dx*Math.sin(-cam.tx)+dz*Math.cos(-cam.tx);
    var ry=dy*Math.cos(-cam.ty)-rz*Math.sin(-cam.ty);
    var rz2=dy*Math.sin(-cam.ty)+rz*Math.cos(-cam.ty);
    if(rz2<0.03)return null;
    var scale=3.5/(rz2+0.5);
    return{x:VPX+rx*scale*W*0.28,y:VPY-ry*scale*H*0.22,scale:scale,rz:rz2};
  }

  var gS=18,gSp=0.4;
  var blds=[];
  for(var i=0;i<80;i++){
    var bx=(Math.random()-0.5)*gS*gSp,bz=0.3+Math.random()*gS*gSp*0.9;
    var bw=0.12+Math.random()*0.7,bh=0.4+Math.random()*3,bd=0.08+Math.random()*0.6;
    var hue=[195,270,330,180,210,285][Math.floor(Math.random()*6)];
    blds.push({x:bx,z:bz,w:bw,h:bh,d:bd,hue:hue,glow:0.5+Math.random()*0.5,pulse:Math.random()*Math.PI*2,ps:0.015+Math.random()*0.05,a2:Math.random()>0.35,gridC:[],sec:Math.floor(1+Math.random()*4)});
  }
  for(var i=0;i<blds.length;i++)for(var j=i+1;j<blds.length;j++){var dx=blds[i].x-blds[j].x,dz=blds[i].z-blds[j].z;if(Math.sqrt(dx*dx+dz*dz)<1.6&&Math.random()<0.25)blds[i].gridC.push(j)}

  var df=[];for(var i=0;i<100;i++){var o={x:(Math.random()-0.5)*gS*gSp,z:0.05,sp:0.02+Math.random()*0.12,hue:[195,270,330,180][Math.floor(Math.random()*4)]};o.ox=o.x;df.push(o)}
  var fp=[];for(var i=0;i<120;i++)fp.push({x:(Math.random()-0.5)*10,y:0.5+Math.random()*5,z:0.1+Math.random()*7,vx:(Math.random()-0.5)*0.012,vy:(Math.random()-0.5)*0.01,vz:(Math.random()-0.5)*0.012,size:0.4+Math.random()*2.5,hue:[195,270,330,180][Math.floor(Math.random()*4)],a:0.25+Math.random()*0.7});
  var cc='01ABCDEFGHIJKLシステムリンクデータフローネットワーク'.split(''),fc=[];for(var i=0;i<40;i++)fc.push({x:(Math.random()-0.5)*9,y:0.5+Math.random()*5,z:0.2+Math.random()*6,vx:(Math.random()-0.5)*0.008,vy:(Math.random()-0.5)*0.006,vz:(Math.random()-0.5)*0.008,text:cc[Math.floor(Math.random()*cc.length)],a:0.15+Math.random()*0.4});
  var pulses=[];setInterval(function(){pulses.push({x:(Math.random()-0.5)*gS*gSp,z:0.3+Math.random()*gS*gSp*0.7,r:0,a:0.5})},3000);

  function dB(b,md){
    var fbl=project(b.x-b.w/2,b.h,b.z),fbr=project(b.x+b.w/2,b.h,b.z),ftl=project(b.x-b.w/2,0,b.z),ftr=project(b.x+b.w/2,0,b.z);
    if(!fbl||!ftl||!ftr||!fbr)return;
    var alpha=b.glow*(0.7+Math.sin(T*b.ps+b.pulse)*0.3);
    if(md<250)alpha=Math.min(1,alpha+(250-md)/250*0.4);
    var h=b.hue,sat=85,lum=62;if(md<200){sat=95;lum=78}

    var btl=project(b.x-b.w/2,0,b.z+b.d),btr=project(b.x+b.w/2,0,b.z+b.d),bbl=project(b.x-b.w/2,b.h,b.z+b.d),bbr=project(b.x+b.w/2,b.h,b.z+b.d);
    for(var s=1;s<b.sec;s++){var sy=b.h*(s/b.sec),sl=project(b.x-b.w/2,sy,b.z),sr=project(b.x+b.w/2,sy,b.z);if(sl&&sr){X.strokeStyle='hsla('+h+',80%,55%,'+alpha*0.12+')';X.lineWidth=0.4;X.beginPath();X.moveTo(sl.x,sl.y);X.lineTo(sr.x,sr.y);X.stroke()}}
    X.strokeStyle='hsla('+h+','+sat+'%,'+lum+'%,'+alpha+')';X.lineWidth=1.8;
    X.shadowColor='hsla('+h+','+sat+'%,'+lum+'%,'+alpha*0.7+')';X.shadowBlur=10;
    X.beginPath();X.moveTo(ftl.x,ftl.y);X.lineTo(ftr.x,ftr.y);X.lineTo(fbr.x,fbr.y);X.lineTo(fbl.x,fbl.y);X.closePath();X.stroke();
    X.strokeStyle='hsla('+h+',100%,85%,'+alpha+')';X.lineWidth=2.5;X.shadowBlur=18;X.beginPath();X.moveTo(ftl.x,ftl.y);X.lineTo(ftr.x,ftr.y);X.stroke();X.shadowBlur=0;
    var midY=ftl.y+(fbl.y-ftl.y)*0.5,midX=ftl.x+(ftr.x-ftl.x)*0.5;X.strokeStyle='hsla('+h+',75%,55%,'+alpha*0.12+')';X.lineWidth=0.4;X.beginPath();X.moveTo(ftl.x,midY);X.lineTo(ftr.x,midY);X.moveTo(midX,ftl.y);X.lineTo(midX,fbl.y);X.stroke();
    if(btl&&btr){X.strokeStyle='hsla('+h+',80%,50%,'+alpha*0.35+')';X.lineWidth=0.7;X.beginPath();X.moveTo(ftr.x,ftr.y);X.lineTo(btr.x,btr.y);X.lineTo(bbr.x,bbr.y);X.lineTo(fbr.x,fbr.y);X.stroke()}
    if(b.a2){var tx=(ftl.x+ftr.x)/2,ty=ftl.y;X.strokeStyle='rgba(255,20,20,0.7)';X.lineWidth=1;X.beginPath();X.moveTo(tx,ty);X.lineTo(tx,ty-18*fbl.scale);X.stroke();X.fillStyle='#ff1414';X.shadowColor='rgba(255,0,0,0.9)';X.shadowBlur=6;X.beginPath();X.arc(tx,ty-18*fbl.scale,2.5,0,Math.PI*2);X.fill();X.shadowBlur=0}
  }

  function drawGrid(){
    for(var i=0;i<2;i++){X.strokeStyle='rgba(0,229,255,'+(i===0?'0.05':'0.03')+')';X.lineWidth=0.5;
      for(var gx=-gS;gx<gS;gx++){X.beginPath();for(var gz=0;gz<=gS;gz++){var p=project(gx*gSp+(i*0.1),0,gz*gSp);if(p)X.lineTo(p.x,p.y);else{X.moveTo(0,0);X.beginPath()}}X.stroke()}
      for(var gz=0;gz<=gS;gz++){X.beginPath();for(var gx=-gS;gx<=gS;gx++){var p=project(gx*gSp+(i*0.1),0,gz*gSp);if(p)X.lineTo(p.x,p.y);else{X.moveTo(0,0);X.beginPath()}}X.stroke()}
    }
  }

  function drawConn(){
    blds.forEach(function(b){b.gridC.forEach(function(j){var ob=blds[j],p1=project(b.x,b.h*0.6,b.z),p2=project(ob.x,ob.h*0.6,ob.z);if(!p1||!p2)return;var alpha=0.08+Math.sin(T*0.025+b.pulse)*0.04;X.strokeStyle='rgba(0,200,255,'+alpha+')';X.lineWidth=0.5;X.setLineDash([3,7]);X.beginPath();X.moveTo(p1.x,p1.y);X.lineTo(p2.x,p2.y);X.stroke();X.setLineDash([]);var dp=(T*0.02+b.pulse*2)%1;X.fillStyle='rgba(0,255,255,0.6)';X.beginPath();X.arc(p1.x+(p2.x-p1.x)*dp,p1.y+(p2.y-p1.y)*dp,2,0,Math.PI*2);X.fill()})});
  }

  function drawFlow(){
    df.forEach(function(d){d.z+=d.sp;if(d.z>gS*gSp){d.z=0.05;d.x=(Math.random()-0.5)*gS*gSp;d.ox=d.x}d.x=d.ox+Math.sin(d.z*5+T*0.02)*0.3;var p=project(d.x,0.02,d.z);if(!p)return;X.fillStyle='hsla('+d.hue+',90%,85%,0.8)';X.shadowColor='hsla('+d.hue+',90%,75%,0.7)';X.shadowBlur=5;X.beginPath();X.arc(p.x,p.y,1.8*p.scale,0,Math.PI*2);X.fill();X.shadowBlur=0});
  }

  function drawFP(){
    fp.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;if(Math.abs(p.x)>6.5)p.vx*=-1;if(p.y>5.5||p.y<0.15)p.vy*=-1;if(p.z>7.5||p.z<0.05)p.vz*=-1;var proj=project(p.x,p.y,p.z);if(!proj||proj.x<0||proj.x>W||proj.y<0||proj.y>H)return;X.fillStyle='hsla('+p.hue+',80%,80%,'+p.a+')';X.beginPath();X.arc(proj.x,proj.y,p.size*proj.scale,0,Math.PI*2);X.fill()});
  }

  function drawFC(){
    fc.forEach(function(f){f.x+=f.vx;f.y+=f.vy;f.z+=f.vz;if(Math.abs(f.x)>5)f.vx*=-1;if(f.y>5||f.y<0.2)f.vy*=-1;if(f.z>6.5||f.z<0.1)f.vz*=-1;var proj=project(f.x,f.y,f.z);if(!proj||proj.x<0||proj.x>W||proj.y<0||proj.y>H)return;X.font=(10*proj.scale)+'px "JetBrains Mono",monospace';X.fillStyle='rgba(0,229,255,'+f.a+')';X.textAlign='center';X.fillText(f.text,proj.x,proj.y)});
  }

  function drawPulses(){
    for(var i=pulses.length-1;i>=0;i--){var p=pulses[i];p.r+=0.03;p.a-=0.003;if(p.a<=0){pulses.splice(i,1);continue}var cp=project(p.x,0.05,p.z);if(cp){X.beginPath();X.arc(cp.x,cp.y,p.r*20,0,Math.PI*2);X.strokeStyle='rgba(0,229,255,'+p.a*0.3+')';X.lineWidth=1.5;X.stroke()}}
  }

  function drawClicks(){
    for(var i=clicks.length-1;i>=0;i--){var cl=clicks[i];cl.r+=4;cl.a-=0.012;if(cl.a<=0){clicks.splice(i,1);continue}X.beginPath();X.arc(cl.x,cl.y,cl.r,0,Math.PI*2);X.strokeStyle='rgba(0,229,255,'+cl.a+')';X.lineWidth=2.5;X.shadowColor='rgba(0,229,255,'+cl.a+')';X.shadowBlur=20;X.stroke();X.shadowBlur=0}
  }

  function drawHUD(){
    X.strokeStyle='rgba(0,229,255,0.3)';X.lineWidth=1.2;var bs=22;
    X.beginPath();X.moveTo(10,10+bs);X.lineTo(10,10);X.lineTo(10+bs,10);X.stroke();
    X.beginPath();X.moveTo(W-10-bs,10);X.lineTo(W-10,10);X.lineTo(W-10,10+bs);X.stroke();
    X.beginPath();X.moveTo(10,H-10-bs);X.lineTo(10,H-10);X.lineTo(10+bs,H-10);X.stroke();
    X.beginPath();X.moveTo(W-10-bs,H-10);X.lineTo(W-10,H-10);X.lineTo(W-10,H-10-bs);X.stroke();
    X.font='9px "JetBrains Mono",monospace';X.fillStyle='rgba(0,229,255,0.2)';X.textAlign='right';
    ['SYS:ONLINE','NEURAL:ACTIVE'].forEach(function(t,i){X.fillText(t,W-18,35+i*15)});
    var d=new Date();X.textAlign='right';X.fillText(d.toTimeString().substring(0,8)+' UTC+8',W-18,H-32);
  }

  function animate(){
    T++;
    cam.tx=-0.15+Math.sin(T*0.0004)*0.12+(M.x/W-0.5)*0.25;
    cam.ty=-0.22+Math.cos(T*0.00035)*0.06+(M.y/H-0.5)*0.08;
    cam.z=(0.8+Math.sin(T*0.00025)*0.25)-(T*0.00008);if(cam.z<0.3)cam.z=1.2;
    cam.y+=scrollY*0.0003;scrollY=0;

    var sk=X.createLinearGradient(0,0,0,H);
    sk.addColorStop(0,'#010412');sk.addColorStop(0.35,'#020a22');sk.addColorStop(0.65,'#030d2a');sk.addColorStop(1,'#041030');
    X.fillStyle=sk;X.fillRect(0,0,W,H);
    drawGrid();drawPulses();drawConn();
    blds.sort(function(a,b){return(a.z+a.d)-(b.z+b.d)});
    blds.forEach(function(b){var bp=project(b.x,b.h*0.5,b.z);var dist=bp?Math.sqrt((bp.x-M.x)**2+(bp.y-M.y)**2):9999;dB(b,dist)});
    drawFlow();drawFC();drawFP();drawClicks();
    for(var i=0;i<4;i++){var sy=(T*1.5+i*H/4)%H;X.strokeStyle='rgba(0,229,255,'+(0.02+Math.sin(sy)*0.015)+')';X.lineWidth=0.8;X.beginPath();X.moveTo(0,sy);X.lineTo(W,sy);X.stroke()}
    var fg=X.createLinearGradient(0,VPY+60,0,H);fg.addColorStop(0,'rgba(2,4,16,0)');fg.addColorStop(0.45,'rgba(2,4,16,0.55)');fg.addColorStop(1,'rgba(1,2,8,0.9)');X.fillStyle=fg;X.fillRect(0,VPY+60,W,H-VPY-60);
    drawHUD();
    
// ===== CURSOR TRAIL =====
var trailCtx2=document.getElementById('trail-canvas').getContext('2d');
var trailPos2=[];
document.addEventListener('mousemove',function(e){trailPos2.push({x:e.clientX,y:e.clientY,t:performance.now()});if(trailPos2.length>25)trailPos2.shift()});
function drawTrail2(){
  trailCtx2.clearRect(0,0,window.innerWidth,window.innerHeight);
  for(var i=0;i<trailPos2.length;i++){var p=trailPos2[i],age=(performance.now()-p.t)/1000,alpha=Math.max(0,0.5-age*2.5),r=1+(i/trailPos2.length)*5;
    trailCtx2.beginPath();trailCtx2.arc(p.x,p.y,r,0,Math.PI*2);
    trailCtx2.fillStyle='rgba(0,229,255,'+alpha+')';trailCtx2.fill();
    trailCtx2.beginPath();trailCtx2.arc(p.x,p.y,r*2.5,0,Math.PI*2);
    trailCtx2.fillStyle='rgba(0,229,255,'+alpha*0.15+')';trailCtx2.fill();
  }
  requestAnimationFrame(drawTrail2);
}
drawTrail2();
requestAnimationFrame(animate);
  }
  animate();
})();
</script>
